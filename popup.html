<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><title>Checkout Bot</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="header-text">
      <div class="logo">🤖 Checkout Bot</div>
      <div class="subtitle">Automated checkout assistant</div>
    </div>
    <button id="closeBtn" class="close-btn" title="Close">✕</button>
  </div>

  <!-- Top-level profile switcher — two independent bot configs -->
  <div class="profile-tabs">
    <button class="profile-tab active" data-profile="default">🤖 Bot</button>
    <button class="profile-tab" data-profile="sams">🏪 Sam's</button>
  </div>

  <div class="status-bar" id="statusBar">
    <span class="status-dot idle" id="statusDot"></span>
    <span id="statusText">Idle – configure and press Start</span>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="item">🔍 Item</button>
    <button class="tab" data-tab="address">📦 Address</button>
    <button class="tab" data-tab="payment">💳 Payment</button>
  </div>

  <div class="tab-panel active" id="tab-item">
    <div class="form-group">
      <label>Site URL</label>
      <input type="text" id="siteUrl" placeholder="http://localhost:3000" value="http://localhost:3000">
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="useCurrentTab">
      <label for="useCurrentTab">Use current tab (don't navigate)</label>
    </div>
    <div class="search-type-row">
      <button class="search-type-btn active" id="btnByName" data-type="name">By Name</button>
      <button class="search-type-btn" id="btnBySku" data-type="sku">By SKU</button>
    </div>
    <div class="form-group" id="nameGroup">
      <label>Item Name</label>
      <input type="text" id="itemName" placeholder="e.g. Prismatic Evolutions">
    </div>
    <div class="form-group" id="skuGroup" style="display:none">
      <label>SKU / Product ID</label>
      <input type="text" id="itemSku" placeholder="e.g. product-001">
      <span class="field-hint">Available SKUs: product-001, product-002</span>
    </div>
    <input type="hidden" id="searchType" value="name">
    <div class="form-group"><label>Max Price ($)</label><input type="number" id="maxPrice" placeholder="999" value="999" min="0"></div>
    <div class="form-group"><label>Auto-refresh interval (seconds)</label><input type="number" id="refreshInterval" placeholder="2" value="2" min="1" max="60"></div>
    <div class="checkbox-row"><input type="checkbox" id="stopOnSuccess" checked><label for="stopOnSuccess">Stop bot after successful order</label></div>
  </div>

  <div class="tab-panel" id="tab-address">
    <div class="form-group"><label>First Name</label><input type="text" id="firstName" placeholder="John"></div>
    <div class="form-group"><label>Last Name</label><input type="text" id="lastName" placeholder="Doe"></div>
    <div class="form-group"><label>Email</label><input type="email" id="email" placeholder="you@email.com"></div>
    <div class="form-group"><label>Street Address</label><input type="text" id="address" placeholder="123 Main Street"></div>
    <div class="form-row">
      <div class="form-group"><label>City</label><input type="text" id="city" placeholder="Springfield"></div>
      <div class="form-group small"><label>State</label><input type="text" id="state" placeholder="IL" maxlength="2"></div>
      <div class="form-group small"><label>ZIP</label><input type="text" id="zip" placeholder="62701" maxlength="5"></div>
    </div>
  </div>

  <div class="tab-panel" id="tab-payment">
    <div class="form-group"><label>Card Number</label><input type="text" id="cardNumber" placeholder="1234 5678 9012 3456" maxlength="19"></div>
    <div class="form-group"><label>Name on Card</label><input type="text" id="cardName" placeholder="John Doe"></div>
    <div class="form-row">
      <div class="form-group"><label>Expiry (MM/YY)</label><input type="text" id="expiry" placeholder="12/28" maxlength="5"></div>
      <div class="form-group small"><label>CVV</label><input type="text" id="cvv" placeholder="123" maxlength="4"></div>
    </div>
    <p class="demo-note">⚠️ Demo only – data never leaves your browser</p>
  </div>

  <div class="log-section">
    <div class="log-header"><span>📋 Activity Log</span><button id="clearBtn" class="clear-btn">Clear</button></div>
    <div class="log" id="log"><div class="log-entry info">Bot ready. Configure and press Start.</div></div>
  </div>

  <div class="controls">
    <button class="btn-save" id="saveBtn">💾 Save</button>
    <button class="btn-start" id="startBtn">▶ Start Bot</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
